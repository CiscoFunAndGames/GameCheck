name: GameCheck CI & CalVer Auto-Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force publish/update GitHub Release for current version.json'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  bump-calver:
    name: Auto-Bump CalVer Version
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      calver: ${{ steps.bump.outputs.calver }}
      full_version: ${{ steps.bump.outputs.full_version }}
      git_tag: ${{ steps.bump.outputs.git_tag }}
      build_ref: ${{ steps.bump.outputs.build_ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Bump CalVer & Commit Version Update
        id: bump
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Tag push detected (${{ github.ref_name }}); keeping version.json as-is."
          else
            node scripts/calver.js bump "Automated CI release build (${GITHUB_SHA::7})"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add version.json package.json
            if ! git diff --cached --quiet; then
              FULL_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf8')).fullVersion)")
              git commit -m "chore(release): bump CalVer to v${FULL_VER} [skip ci]"
              git push origin "HEAD:${{ github.ref_name }}"
            fi
          fi
          FULL_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf8')).fullVersion)")
          CALVER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf8')).calver)")
          echo "calver=${CALVER}" >> $GITHUB_OUTPUT
          echo "full_version=${FULL_VER}" >> $GITHUB_OUTPUT
          echo "git_tag=v${FULL_VER}" >> $GITHUB_OUTPUT
          echo "build_ref=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-windows:
    name: Build & Verify Windows Native C++ Installer (.exe)
    needs: [bump-calver]
    runs-on: windows-latest
    outputs:
      calver: ${{ steps.version.outputs.calver }}
      full_version: ${{ steps.version.outputs.full_version }}
      git_tag: ${{ steps.version.outputs.git_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-calver.outputs.build_ref }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Read CalVer Metadata from version.json
        id: version
        shell: pwsh
        run: |
          $v = Get-Content version.json | ConvertFrom-Json
          "calver=$($v.calver)" >> $env:GITHUB_OUTPUT
          "full_version=$($v.fullVersion)" >> $env:GITHUB_OUTPUT
          "git_tag=v$($v.fullVersion)" >> $env:GITHUB_OUTPUT
          Write-Host "CalVer: $($v.calver) | Full Version: $($v.fullVersion)"

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Compile C++17 Native Display Probe & Desktop GUI (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          g++ -O2 -std=c++17 native/rigcheck_probe.cpp -o bin/rigcheck-native-probe.exe -luser32 -lgdi32 -ladvapi32 -static -s
          g++ -O2 -std=c++17 native/test_core.cpp -o bin/test-gamecheck-core.exe -luser32 -lgdi32 -ladvapi32 -lshell32 -lwinhttp -static -s
          windres native/gamecheck.rc -O coff -o native/gamecheck_res.o
          g++ -O2 -std=c++17 -mwindows native/gamecheck_desktop.cpp native/gamecheck_res.o -o bin/GameCheck.exe -lgdiplus -luxtheme -lcomctl32 -lcomdlg32 -lshell32 -luser32 -lgdi32 -ladvapi32 -lole32 -luuid -lwinhttp -static -s
          .\bin\rigcheck-native-probe.exe
          .\bin\test-gamecheck-core.exe
          .\bin\GameCheck.exe --smoke-test

      - name: Build SHA-256 Live Patch Bundle & Native C++ Windows Installer
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist\* }
          node scripts/create-patch.js
          node scripts/build-installer.js

      - name: Verify Native C++ Windows Setup Executable (--verify & --check-deps)
        shell: pwsh
        run: |
          $exe = Join-Path dist "GameCheck-Setup-${{ steps.version.outputs.calver }}.exe"
          if (-not (Test-Path $exe)) { throw "Windows .exe installer not found at $exe" }
          & $exe --verify
          & $exe --check-deps

      - name: Run Full Verification & Unit Test Suite (Windows)
        shell: pwsh
        run: node test/run-all.js

      - name: Upload Windows Downloadable Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: GameCheck-Windows-Installer
          path: |
            dist/GameCheck-Setup-${{ steps.version.outputs.calver }}.exe
            dist/GameCheck-App-Payload-${{ steps.version.outputs.calver }}.zip
            dist/rigcheck-patch-*.rigpatch.json
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error

  build-linux:
    name: Build & Verify Linux Self-Contained Installer (.sh)
    needs: [bump-calver]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-calver.outputs.build_ref }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Linux System Dependencies (g++, libgtk-3-dev, pkg-config, pciutils, mesa-utils, x11-xserver-utils, unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgtk-3-dev pkg-config pciutils mesa-utils x11-xserver-utils unzip zip

      - name: Install NPM Dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compile C++17 Native Display & Driver Probe + GTK3 Desktop GUI (Linux)
        run: |
          mkdir -p bin
          g++ -O2 -std=c++17 native/rigcheck_probe.cpp -o bin/rigcheck-native-probe
          chmod +x bin/rigcheck-native-probe
          ./bin/rigcheck-native-probe || true
          if pkg-config --exists gtk+-3.0; then
            g++ -O2 -std=c++17 -DGAMECHECK_USE_GTK native/gamecheck_desktop.cpp -o bin/gamecheck $(pkg-config --cflags --libs gtk+-3.0) -lpthread
          else
            g++ -O2 -std=c++17 native/gamecheck_desktop.cpp -o bin/gamecheck -lpthread
          fi
          chmod +x bin/gamecheck
          ./bin/gamecheck --smoke-test

      - name: Build SHA-256 Live Patch Bundle & Linux Self-Contained Installer
        run: |
          rm -rf dist/*
          node scripts/create-patch.js
          node scripts/build-installer.js

      - name: Verify Linux Self-Contained Installer (--verify & --check-deps)
        run: |
          CALVER=$(node -p "require('./version.json').calver")
          chmod +x "dist/gamecheck-installer-${CALVER}.sh"
          bash "dist/gamecheck-installer-${CALVER}.sh" --verify
          bash "dist/gamecheck-installer-${CALVER}.sh" --check-deps

      - name: Run Full Verification & Unit Test Suite (Linux)
        run: node test/run-all.js

      - name: Upload Linux Downloadable Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: GameCheck-Linux-Installer
          path: |
            dist/gamecheck-installer-*.sh
          if-no-files-found: error

  publish-release:
    name: Publish CalVer GitHub Release & Downloadable Binaries
    needs: [bump-calver, build-windows, build-linux]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-calver.outputs.build_ref }}

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: GameCheck-Windows-Installer
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          name: GameCheck-Linux-Installer
          path: release-assets

      - name: Generate Combined SHA256SUMS.txt & Release Body
        id: release_prep
        run: |
          cd release-assets
          chmod +x gamecheck-installer-*.sh 2>/dev/null || true
          sha256sum GameCheck-Setup-*.exe gamecheck-installer-*.sh GameCheck-App-Payload-*.zip rigcheck-patch-*.rigpatch.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const sums = fs.readFileSync("release-assets/SHA256SUMS.txt", "utf8").trim();
            const patchFile = fs.readdirSync("release-assets").find(f => f.endsWith(".rigpatch.json")) || `rigcheck-patch-${v.fullVersion}.rigpatch.json`;
            const historyMd = Array.isArray(v.history)
              ? v.history.map(h => `- **v${h.version}** (\`${h.calver}\` patch \`.${h.patchLevel}\`): ${h.notes}`).join("\n")
              : `- **v${v.fullVersion}**: ${v.notes}`;
            const body = [
              `## GameCheck — Release \`v${v.fullVersion}\` (\`${v.calver}\`)`,
              "",
              v.notes,
              "",
              "### Direct Downloads (Windows & Linux)",
              `- **Windows Native C++ Setup (\`.exe\`)**: \`GameCheck-Setup-${v.calver}.exe\` (Self-extracting Win32 C++17 installer with embedded payload, Desktop/Start Menu shortcuts & uninstaller)`,
              `- **Linux Self-Contained Installer (\`.sh\`)**: \`gamecheck-installer-${v.calver}.sh\` (Prompts for install folder & dependencies, compiles C++17 GTK3 app & creates desktop launcher)`,
              `- **Portable App Payload (\`.zip\`)**: \`GameCheck-App-Payload-${v.calver}.zip\``,
              `- **SHA-256 Live Delta Patch (\`.rigpatch.json\`)**: \`${patchFile}\``,
              "",
              "### Release History",
              historyMd,
              "",
              "### SHA-256 Checksums (\`SHA256SUMS.txt\`)",
              "```text",
              sums,
              "```"
            ].join("\n");
            fs.writeFileSync("RELEASE_NOTES.md", body, "utf8");
          '

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: v${{ needs.build-windows.outputs.full_version }}
          REL_NAME: GameCheck v${{ needs.build-windows.outputs.full_version }} (CalVer ${{ needs.build-windows.outputs.calver }})
        run: |
          shopt -s nullglob
          ASSETS=(
            release-assets/GameCheck-Setup-*.exe
            release-assets/gamecheck-installer-*.sh
            release-assets/GameCheck-App-Payload-*.zip
            release-assets/rigcheck-patch-*.rigpatch.json
            release-assets/SHA256SUMS.txt
            release-assets/release-manifest.json
          )
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release edit "$REL_TAG" --title "$REL_NAME" --notes-file RELEASE_NOTES.md
            gh release upload "$REL_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$REL_TAG" "${ASSETS[@]}" --title "$REL_NAME" --notes-file RELEASE_NOTES.md
          fi

      - name: Sync main back into dev
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout dev
          git merge --no-edit -X theirs origin/main || true
          git push origin dev
